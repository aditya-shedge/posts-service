# Test configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=your-256-bit-secret-key-minimum-32-characters!!

# Kafka consumer config
# bootstrap-servers is overridden per test via @DynamicPropertySource or @EmbeddedKafka
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=posts-service-test
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*

app.kafka.topic.post-moderation=post-moderation

# HuggingFace - dummy value for tests (service is mocked)
app.huggingface.api-key=test-huggingface-key

# Cloudinary (dummy values for tests - we mock the service)
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.attachment.temp-dir=${java.io.tmpdir}/posts-attachments-test
