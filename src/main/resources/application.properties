spring.application.name=posts-service

spring.datasource.url=jdbc:postgresql://localhost:5432/postsdb
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:your-256-bit-secret-key-minimum-32-characters!!}

# Cloudinary configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# File upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Attachment temp storage
app.attachment.temp-dir=${java.io.tmpdir}/posts-attachments
app.attachment.retry-interval-ms=30000
